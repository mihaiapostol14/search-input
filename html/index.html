<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Company Name</title>
</head>
<body>

        <form action="#" method="GET" class="search-container" role="search">
        
            <label for="search-input" class="visually-hidden">Search the site</label>
            <input
                type="search"
                id="search-input"
                name="q"
                class="search-input"
                placeholder="Search..."
                required
                aria-label="Search"
            >
        
            <button type="submit" class="search-submit-btn" aria-label="Submit search">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            </button>
        
        </form>
</body>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/style.css">
    <script type="text/javascript" src="../js/script.js"></script>
</html>
